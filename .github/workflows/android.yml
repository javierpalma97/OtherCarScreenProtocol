name: OCSP CI (tests + APK)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server-source/requirements.txt
      - run: python -m pytest server-source/tests/test_axproto.py server-source/tests/test_server.py -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - working-directory: client-android
        run: |
          chmod +x gradlew
          ./gradlew :axproto:test assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AXViewer-debug-APK
          path: client-android/app/build/outputs/apk/debug/app-debug.apk
